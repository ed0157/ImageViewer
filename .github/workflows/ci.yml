name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests from forks get a read-only token and no secrets, so a build here cannot change the
# repository or reach anything private. This workflow only needs to read the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      # Actions are pinned to full commit IDs (the tag is in the comment) so a moved tag
      # cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build universal app
        run: scripts/build.sh

      - name: Package installer
        run: scripts/package.sh

      - name: Upload build for review
        # Not for pull requests from forks, so outside code never produces a downloadable installer here.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ImageViewer-dev-build
          path: |
            build/*.dmg
            build/*.zip
          retention-days: 7
